<script> (function() {
        const redirectPath = 'lock.html';

        function isLocalDevHost() {
            const h = window.location.hostname;
            if (h === '127.0.0.1' || h === 'localhost' || h === '[::1]') return true;
            if (/^192\.168\.\d{1,3}\.\d{1,3}$/.test(h)) return true;
            if (/^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(h)) return true;
            if (/^172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}$/.test(h)) return true;
            return false;
        }

        function isTeacherAdminSession() {
            if (window.AdminRoles?.isTeacherAdminUser?.()) return true;
            if (sessionStorage.getItem('admin_auth') === 'granted') return true;
            return (localStorage.getItem('studentName') || '').trim() === '김회준'
                && localStorage.getItem('reserved_name_kimhj_verified') === '1';
        }

        const isLocalDev = isLocalDevHost();
        const skipAntiDebug = isLocalDev || isTeacherAdminSession();

        // [보안 1] 출입증 확인 (학생 인증 또는 관리자 세션)
        const hasStudentAuth = sessionStorage.getItem('auth_status') === 'verified';
        const hasAdminAuth = sessionStorage.getItem('admin_auth') === 'granted';
        if (!hasStudentAuth && !hasAdminAuth) {
            window.location.replace(redirectPath);
            return;
        }

        // [보안 5] 최종 외곽 방어선 (2번 창 -> 완전 종료)
        if (!history.state || history.state.page !== 'subject_select') {
            window.history.pushState({ page: 'subject_select' }, "", window.location.href);
        }
        window.addEventListener('popstate', function(event) {
            if (confirm("CBT 시스템을 완전히 종료하시겠습니까?")) {
                window.location.replace(redirectPath);
            } else {
                window.history.pushState({ page: 'subject_select' }, "", window.location.href);
            }
        });

        // Go Live / 로컬·교사 관리자 세션에서는 개발자도구 감시 비활성화
        if (skipAntiDebug) {
            console.log('🛠️ [정비 모드] 로컬/교사 관리자 세션 — 개발자도구 감시를 일시 정지합니다.');
            return;
        }

        // [보안 2] 정밀 추방 로직
        const evict = () => window.location.replace(redirectPath);

        // [보안 3] 메인 감시 엔진 (0.2초마다 순찰)
        setInterval(function() {
            const start = Date.now();
            debugger;
            const end = Date.now();
            if (end - start > 100) {
                evict();
            }
        }, 200);

        // [보안 4] 단축키 및 우클릭 원천 차단
        document.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && [73, 74].includes(e.keyCode)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                evict();
            }
        });
    })(); </script> <!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>CBT 자격증 선택</title> <link rel="stylesheet" href="01자격증선택.css"> <link rel="stylesheet" href="studentNameBar.css?v=20260903e"> <script src="adminRoles.global.js?v=20260831"></script> <script src="rankingBadges.global.js?v=20260903e"></script> <script src="badgeAcquireReview.global.js?v=20260903e"></script> <script src="studentNameBar.global.js?v=20260902"></script> </head> <body> <header class="student-top-header no-drag"> <div class="student-name-bar" id="student-name-bar"> <div class="student-name-bar-inner"> <div class="student-name-bar-side student-name-bar-side-left" aria-hidden="true"></div> <div id="student-name-display" class="student-name-display"> <span id="student-rank-badges" class="student-rank-badges hidden" aria-hidden="true"></span> <span id="student-name-badge" class="student-name-badge hidden" aria-hidden="true"></span> <span id="student-name-text" class="student-name-text"></span> </div> <div class="student-name-bar-side student-name-bar-side-right"> <button type="button" id="btn-badge-acquire-review" class="btn-badge-acquire-review hidden">[뱃지 획득확인]</button> </div> </div> </div> </header> <div id="teacher-admin-bar" class="teacher-admin-bar hidden"> <button type="button" id="btn-go-admin" class="teacher-admin-btn" title="관리자 화면"> <span class="teacher-admin-icon" aria-hidden="true">⚙</span> <span class="teacher-admin-label">관리자</span> </button> <button type="button" id="btn-admin-logout" class="teacher-admin-btn teacher-admin-logout" title="관리자 로그아웃"> 로그아웃 </button> <button type="button" id="btn-pdf-import" class="teacher-admin-btn teacher-admin-pdf" title="PDF에서 문제 추출"> PDF 추출 </button> </div> <div id="pageContent"> <h1>CBT 자격증 선택</h1> <div class="random-wrapper industry-master-wrap" id="industry-master-wrap"> <div class="round-card random-card industry-master-trigger" id="industry-master-trigg   var wrap = document.getElementById('industry-master-wrap');
  var trigger = document.getElementById('industry-master-trigger');
  var choice = document.getElementById('industry-type-choice');

  function setExpanded(expanded) {
    wrap.classList.toggle('expanded', expanded);
    choice.setAttribute('aria-hidden', expanded ? 'false' : 'true');
  }

  trigger.addEventListener('click', function () {
    setExpanded(!wrap.classList.contains('expanded'));
  });

  trigger.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    trigger.click();
  });

  choice.querySelectorAll('.industry-type-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      window.location.href = btn.getAttribute('data-href');
    });
  });

  document.addEventListener('click', function (e) {
    if (!wrap.classList.contains('expanded')) return;
    if (!wrap.contains(e.target)) setExpanded(false);
  });
})();

(function () {
  var wrap = document.getElementById('maintenance-master-wrap');
  var trigger = document.getElementById('maintenance-master-trigger');
  var choice = document.getElementById('maintenance-type-choice');
  if (!wrap || !trigger || !choice) return;

  function setExpanded(expanded) {
    wrap.classList.toggle('expanded', expanded);
    choice.setAttribute('aria-hidden', expanded ? 'false' : 'true');
  }

  trigger.addEventListener('click', function () {
    setExpanded(!wrap.classList.contains('expanded'));
  });

  trigger.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    trigger.click();
  });

  choice.querySelectorAll('.maintenance-type-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      window.location.href = btn.getAttribute('data-href');

  });

  document.addEventListener('click', function (e) {
    if (!wrap.classList.contains('expanded')) return;
    if (!wrap.contains(e.target)) setExpanded(false);
  });
})();

(function () {
  var AR = window.AdminRoles || {};

  function isTeacherAdminUser() {
    if (AR.isTeacherAdminUser) return AR.isTeacherAdminUser();
    if (sessionStorage.getItem('admin_auth') === 'granted') return true;
    return (localStorage.getItem('studentName') || '').trim() === '김회준'
      && localStorage.getItem('reserved_name_kimhj_verified') === '1';
  }

  if (!isTeacherAdminUser()) return;

  var bar = document.getElementById('teacher-admin-bar');
  var btn = document.getElementById('btn-go-admin');
  var logoutBtn = document.getElementById('btn-admin-logout');
  var pdfBtn = document.getElementById('btn-pdf-import');
  if (!bar || !btn) return;

  bar.classList.remove('hidden');
  if (AR.isSubAdminSession && AR.isSubAdminSession()) {
    if (pdfBtn) pdfBtn.classList.add('hidden');
    var label = bar.querySelector('.teacher-admin-label');
    if (label) label.textContent = '담임 관리';
  }

  btn.addEventListener('click', function () {
    sessionStorage.setItem('admin_auth', 'granted');
    if (AR.isSubAdminSession && AR.isSubAdminSession()) {
      sessionStorage.setItem(AR.ADMIN_ROLE_KEY || 'admin_role', 'sub');
    } else {
      sessionStorage.setItem(AR.ADMIN_ROLE_KEY || 'admin_role', 'super');
    }
    var url = new URL(window.location.href);
    var path = url.pathname;
    if (/\/start\/[^/]*$/.test(path)) {
      url.pathname = path.replace(/\/start\/[^/]*$/, '/admin.html');
    } else {
      url.pathname = path.replace(/\/[^/]*$/, '/admin.html');
    }
    window.location.replace(url.href);
  });

  if (logoutBtn) {
    logoutBtn.addEventListener('click', function () {
      var isSub = AR.isSubAdminSession && AR.isSubAdminSession();
      var ok = confirm(isSub
        ? '이 기기에서 담임교사 인증을 해제할까요?\n다음 접속 시 추가 비밀번호가 필요합니다.'
        : '이 기기에서 관리자 인증을 해제할까요?\n다음 접속 시 관리자 전용 비밀번호가 필요합니다.');
      if (!ok) return;
      if (AR.clearSubAdminDeviceProfile) AR.clearSubAdminDeviceProfile();
      if (AR.clearAllStaffVerification) AR.clearAllStaffVerification();
      else {
        localStorage.removeItem('reserved_name_kimhj_verified');
        localStorage.removeItem('sub_admin_verified');
        sessionStorage.removeItem('admin_auth');
      }
      sessionStorage.removeItem('auth_status');
      localStorage.removeItem('studentName');
      localStorage.removeItem('studentClass');
      window.location.replace('lock.html');
    });
  }
})(); </script> <script> window.StudentNameBar?.sync({ updateHeaderOffset: false }); </script> <script type="module"> import { refreshAllCertBadgeMaps } from './문제모음/rankingBadgeRefresh.js';
