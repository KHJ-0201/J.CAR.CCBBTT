(function () {
  var AR = window.AdminRoles || {};

  function isTeacherAdminUser() {
    if (AR.isTeacherAdminUser) return AR.isTeacherAdminUser();
    if (sessionStorage.getItem('admin_auth') === 'granted') return true;
    return (localStorage.getItem('studentName') || '').trim() === '김회준'
      && localStorage.getItem('reserved_name_kimhj_verified') === '1';
  }

  if (!isTeacherAdminUser()) return;

  var bar = document.getElementById('teacher-admin-bar');
  var btn = document.getElementById('btn-go-admin');
  var logoutBtn = document.getElementById('btn-admin-logout');

  var phoneGoLiveBtn = document.getElementById('btn-phone-golive');

  var PHONE_GOLIVE_IP_KEY = 'phone_golive_lan_ip';

  function isLoopbackHost(host) {
    var h = String(host || '').toLowerCase();
    return h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '::1';
  }

  function normalizeLanIp(raw) {
    var v = String(raw || '').trim();
    if (!v) return '';
    v = v.replace(/^https?:\/\//i, '');
    v = v.split('/')[0];
    // strip accidental port from IP input (we keep page port separately)
    if (/^\d{1,3}(?:\.\d{1,3}){3}:\d+$/.test(v)) v = v.split(':')[0];
    return v.trim();
  }

  function askLanIp(defaultIp) {
    var tip =
      '【IP 확인 방법】\n' +
      '1. Windows 검색에서 cmd 실행\n' +
      '2. ipconfig 입력 후 Enter\n' +
      '3. 「무선 LAN 어댑터 Wi-Fi」의 IPv4 주소를 복사\n' +
      '   (유선이면 「이더넷」의 IPv4)\n' +
      '예: 192.168.0.15\n' +
      '※ PC와 폰이 같은 와이파이에 있어야 합니다.';
    var input = window.prompt('폰에서 접속할 PC의 IP 주소를 입력하세요.\n\n' + tip, defaultIp || '');

    var ip = normalizeLanIp(input);
    if (!ip) {
      alert('IP 주소가 비어 있습니다.');
      return null;
    }
    localStorage.setItem(PHONE_GOLIVE_IP_KEY, ip);
    return ip;
  }

  function getLanIp(forceAsk) {
    var saved = normalizeLanIp(localStorage.getItem(PHONE_GOLIVE_IP_KEY) || '');
    if (!forceAsk && saved) return saved;

    var currentHost = window.location.hostname;
    var suggested = saved || (!isLoopbackHost(currentHost) ? currentHost : '');
    if (!forceAsk && suggested && !isLoopbackHost(suggested) && !saved) {
      localStorage.setItem(PHONE_GOLIVE_IP_KEY, suggested);
      return suggested;
    }
    return askLanIp(suggested);
  }

  function buildPhoneGoLiveUrl(ip) {
    var url = new URL(window.location.href);
    url.hostname = ip;
    return url.href;
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () {
        return false;
      });
    }
    return Promise.resolve(false).then(function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    });
  }

  bar.classList.remove('hidden');
  if (AR.isSubAdminSession && AR.isSubAdminSession()) {
    if (pdfBtn) pdfBtn.classList.add('hidden');
    if (phoneGoLiveBtn) phoneGoLiveBtn.classList.add('hidden');
    var label = bar.querySelector('.teacher-admin-label');

  btn.addEventListener('click', function () {

  if (logoutBtn) {
    logoutBtn.addEventListener('click', function () {
