ory-tab-display" class="silgi-category-tabs"></div> <div id="category-select-display" class="silgi-category-panel"></div> </div> </section> <section id="exam-screen" class="hidden"> <nav class="silgi-exam-nav no-drag"> <div class="silgi-exam-timer-bar"> <div id="phase-timer-display" class="silgi-phase-timer">엔진 100:00</div> <div id="score-display" class="silgi-score-display">득점 0 / 100점</div> </div> <div class="silgi-exam-nav-top"> <button type="button" class="btn-nav-small silgi-touch-btn" onclick="confirmExit()"><span class="silgi-btn-short">홈</span><span class="silgi-btn-long">🏠 홈으로</span></button> <strong id="exam-an-title" class="silgi-exam-title">제 1 안</strong> <button type="button" class="btn-nav-small btn-nav-green silgi-touch-btn" onclick="confirmFinish()"><span class="silgi-btn-short">종료</span><span class="silgi-btn-long">📊 시험 종료</span></button> </div> <div class="silgi-exam-nav-bottom"> <div id="progress-display">완료: 0 / 0</div> <div id="total-timer-display" class="silgi-total-timer hidden">총 4:00:00</div> </div> <div class="silgi-phase-actions"> <button type="button" id="btn-next-phase" class="btn-nav-small btn-nav-phase hidden" onclick="advancePhase()">다음 영역 ▶</button> </div> </nav> <div id="exam-display-area" class="silgi-exam-area"></div> </section> <section id="result-screen" class="hidden"> <div class="silgi-result-nav no-drag"> <div class="silgi-result-score"> <span id="final-score-earned">0</span><small> / <span id="final-score-max">100</span>점</small> </div> <div class="silgi-result-btns"> <button type="button" onclick="retryExam()" class="btn-res-nav">다시 풀기</button> <button type="button" onclick="goBackToMain()" class="btn-res-nav btn-gray">메인으로</button> </div> </div> <div id="result-summary" class="silgi-result-summary"></div> </section> </main> <div id="confirm-banner" class="modal-overlay hidden"> <div class="confirm-modal-window glass-card" onclick="event.stopPropagation()"> <div class="banner-body"> <p id="confirm-message" style="text-align
